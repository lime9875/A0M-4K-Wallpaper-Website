<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A0M Vault — 4K Wallpapers</title>
  <meta name="description" content="A0M Vault: a curated vault of 4K desktop wallpapers. Anime, cinematic, minimal and more.">
  <meta name="theme-color" content="#07080c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <!-- Navigation -->
  <header class="nav">
    <a class="brand" href="#top" aria-label="A0M Vault">A0M<span>Vault</span></a>
    <div class="nav-actions">
      <button id="langBtn" class="pill-btn" aria-label="Switch language">AR</button>
      <button id="themeBtn" class="pill-btn" aria-label="Toggle theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <h1 data-i18n="heroTitle">Your screen, reimagined.</h1>
      <p data-i18n="heroSub">A curated vault of 4K desktop wallpapers. Free to preview, ready to download.</p>
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" data-i18n-ph="search" placeholder="Search wallpapers" autocomplete="off">
      </div>
    </section>

    <!-- Trending -->
    <section class="block" id="trendingSection">
      <h2 data-i18n="trending">Trending now</h2>
      <div class="trend-row" id="trending"></div>
    </section>

    <!-- Filters + gallery -->
    <section class="block">
      <h2 data-i18n="browse">Browse the vault</h2>
      <div class="filters" id="filters" role="tablist"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden data-i18n="empty">No wallpapers match. Try another word or category.</p>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div>
      <div class="brand">A0M<span>Vault</span></div>
      <p data-i18n="footTag">Crafted wallpapers for people who care about their desktop.</p>
    </div>
    <a class="wa" href="https://wa.me/201005571547" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 5 5.1-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.200-4.500-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.4.600c-.1.200-.3.300-.1.600.7 1.100 1.500 1.800 2.600 2.400.3.100.4.100.6-.1l.8-1c.2-.2.400-.2.600-.1l1.900.9c.2.100.4.200.4.300.1.100.1.700-.1 1.300z"/></svg>
      <span data-i18n="wa">Chat on WhatsApp</span>
    </a>
    <small>© <span id="year"></span> A0M Vault</small>
  </footer>

  <!-- Preview modal -->
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-card">
      <button class="close" id="close" aria-label="Close">×</button>
      <img id="mImg" alt="">
      <div class="modal-info">
        <div>
          <h3 id="mTitle"></h3>
          <p id="mMeta"></p>
        </div>
        <button id="dl" class="btn" type="button"><span data-i18n="download">Download 4K</span></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
